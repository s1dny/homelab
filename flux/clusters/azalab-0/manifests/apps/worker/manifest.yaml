apiVersion: apps/v1
kind: Deployment
metadata:
  name: plarza-worker
  namespace: plarza
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: plarza-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: plarza-worker
    spec:
      imagePullSecrets:
        - name: plarza-ghcr
      terminationGracePeriodSeconds: 86400
      securityContext:
        runAsGroup: 10001
        runAsUser: 10001
        seccompProfile:
          type: Localhost
          localhostProfile: chromium.json
      containers:
        - name: worker
          image: ghcr.io/plarza/worker:main-bf658f315b2c-10@sha256:83f1b014b176931d91f62a31cd815be2e0fc95cca36dcdd2e22838284c93af1b # {"$imagepolicy": "flux-system:plarza-worker"}
          imagePullPolicy: IfNotPresent
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: plarza-worker
                  key: API_KEY
            - name: EXTENSION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: plarza-worker
                  key: EXTENSION_API_KEY
            - name: DATABASE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: plarza-app
                  key: DATABASE_AUTH_TOKEN
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: plarza-app
                  key: DATABASE_URL
            - name: EXPLORE_CAPTURE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: plarza-worker
                  key: EXPLORE_CAPTURE_TOKEN
            - name: PLARZA_INTERNAL_URL
              value: http://plarza.plarza.svc.cluster.local:3000
            - name: PLARZA_PUBLIC_ORIGIN
              value: https://plarza.com
            - name: CAPTURE_SERVICE_URL
              value: http://plarza-capture.plarza.svc.cluster.local:3010
          ports:
            - name: http
              containerPort: 3009
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "8"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - SYS_CHROOT
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: plarza-worker
  namespace: plarza
spec:
  selector:
    app: plarza-worker
  ports:
    - name: http
      port: 3009
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plarza-capture
  namespace: plarza
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: plarza-capture
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: plarza-capture
    spec:
      imagePullSecrets:
        - name: plarza-ghcr
      securityContext:
        runAsGroup: 10001
        runAsUser: 10001
        seccompProfile:
          type: Localhost
          localhostProfile: chromium.json
      containers:
        - name: capture
          image: ghcr.io/plarza/worker:main-bf658f315b2c-10@sha256:83f1b014b176931d91f62a31cd815be2e0fc95cca36dcdd2e22838284c93af1b # {"$imagepolicy": "flux-system:plarza-worker"}
          imagePullPolicy: IfNotPresent
          command:
            - /usr/bin/tini
            - --
            - /app/capture
          env:
            - name: EXPLORE_CAPTURE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: plarza-worker
                  key: EXPLORE_CAPTURE_TOKEN
          ports:
            - name: http
              containerPort: 3010
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - SYS_CHROOT
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: plarza-capture
  namespace: plarza
spec:
  selector:
    app: plarza-capture
  ports:
    - name: http
      port: 3010
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: plarza-capture
  namespace: plarza
spec:
  podSelector:
    matchLabels:
      app: plarza-capture
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: plarza-worker
      ports:
        - protocol: TCP
          port: 3010
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plarza-worker
  namespace: plarza
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: worker.aza.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: plarza-worker
                port:
                  number: 3009
